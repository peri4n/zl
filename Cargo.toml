[package]
name = "zl"
authors = ["Fabian Bull<contact@fbull.de>"]
version = "0.1.0"
edition = "2024"
description = "A minimal Zettelkasten CLI for markdown notes"
license = "GPL-3.0-or-later"
repository = "https://github.com/peri4n/zl"
readme = "README.md"
keywords = ["zettelkasten", "notes", "markdown", "cli"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.envrc", "/flake.nix", "/flake.lock", "/logo.png", "/release-plz.toml"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4.21"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
markdown = "1.0.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
salsa = "0.28.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tera = { version = "2.4.0", features = ["glob_fs"] }
termtree = "1.0.0"
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
